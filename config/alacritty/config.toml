[cursor.style]
blinking = "Never"

[env]
TERM = "xterm-256color"

[scrolling]
history = 100000
multiplier = 3

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[window]
decorations = "buttonless"
startup_mode = "Windowed"
opacity = 1
resize_increments = true
dynamic_padding = true

[window.dimensions]
columns = 165
lines = 49

[window.padding]
x = 16
y = 16

[general]
live_config_reload = true
